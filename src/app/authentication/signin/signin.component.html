<div class="auth-container">
  <div class="row auth-main">
    <!-- Imagen de fondo, visible solo en pantallas grandes -->
    <div class="col-lg-6 d-none d-lg-block p-0">
      <div class="left-img" style="background-image: url(../../../assets/images/portada-ventas1.jpg);"></div>
    </div>
    <!-- Sección del formulario -->
    <div class="col-lg-6 col-md-12 auth-form-section d-flex justify-content-center align-items-center">
      <div class="form-section w-100 px-4 py-5">
        <div class="auth-wrapper text-center">
          <div class="logo-container mb-4">
            <img src="assets/images/logo-ventas1.jpg" alt="Your Logo" class="logo img-fluid"
              style="width: 150px; height: 150px; border-radius: 50%;">
          </div>
          <h2 class="login-title font-bold mb-4">Iniciar sesión</h2>
          <form class="validate-form" [formGroup]="authForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-12 mb-3">
                <mat-form-field class="example-full-width w-100" appearance="outline">
                  <mat-label>Nombre de Usuario</mat-label>
                  <input matInput formControlName="email" />
                  <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>face</mat-icon>
                  @if (authForm.get('email')?.hasError('required')) {
                  <mat-error>Username o Email es requerido</mat-error>
                  }
                </mat-form-field>
              </div>
            </div>
            <div class="row">
              <div class="col-12 mb-3">
                <mat-form-field class="example-full-width w-100" appearance="outline">
                  <mat-label>Contraseña</mat-label>
                  <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
                  <a href="#" onClick="return false;" matSuffix (click)="hide = !hide"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                    <mat-icon class="material-icons-two-tone color-icon m-3" matSuffix>
                      {{hide ? 'visibility_off' : 'visibility'}}
                    </mat-icon>
                  </a>
                  @if (authForm.get('password')?.hasError('required')) {
                  <mat-error>Contraseña es requerido</mat-error>
                  }
                </mat-form-field>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <label class="form-check-label">
                <span class="form-check-sign">
                  <span class="check"></span>
                  <!-- <span>Olvidé mi contraseña</span> -->
                </span>
              </label>
            </div>
            <div class="container-auth-form-btn">
              <div style="text-align:center">
                <button mat-raised-button color="primary" [class.auth-spinner]="loading" [disabled]="loading"
                  class="auth-form-btn w-100" [disabled]="!authForm.valid " type="submit">Acceso</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
