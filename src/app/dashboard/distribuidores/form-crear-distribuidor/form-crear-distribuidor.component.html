<div class="addContainer">
    <div class="modalHeader">
        <div class="editRowModal">
            <div class="modalHeader clearfix">
                <div class="modal-about">
                    Nuevo Registro
                </div>
            </div>
        </div>
        <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div mat-dialog-content>
        <form class="register-form m-md-4" [formGroup]="form" (ngSubmit)="register()">
            <div class="row">
                <div class="col-md-12 mb-2">
                    <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Movilidades</mat-label>
                        <mat-icon matSuffix>store</mat-icon>
                        <mat-select formControlName="movilidad_id">
                            <ngx-mat-select-search placeholderLabel="Buscar placa"
                                noEntriesFoundLabel="No hay resultados"
                                [formControl]="searchControlMovilidad"></ngx-mat-select-search>
                            <mat-option *ngFor="let item of filteredMovilidades" [value]="item?.id">
                                {{ item?.placa }} - {{item?.color }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <!-- Botones de acción -->
            <div class="row mt-2">
                <div class="d-flex col-12 text-center">
                    <button type="submit" style="margin-right: 5px;" [disabled]="!form.valid || loading"
                        [class.auth-spinner]="loading" mat-raised-button color="primary">
                        <mat-icon>save</mat-icon> Guardar
                    </button>
                    <button type="button" (click)="dialogRef.close()" mat-raised-button data-dismiss="dialogRef"
                        tabindex="-1" color="warn">
                        <mat-icon>cancel</mat-icon> Cancelar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
